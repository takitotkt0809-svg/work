<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 - 3D 多人默契大考驗</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              red: '#FF2E93',
              blue: '#00F0FF',
              dark: '#0A0E17',
              card: '#121824',
              blueDark: '#0A2540',
              redDark: '#4A0E17'
            }
          },
          boxShadow: {
            'neon-blue': '0 0 15px rgba(0, 240, 255, 0.5), 0 0 30px rgba(0, 240, 255, 0.2)',
            'neon-red': '0 0 15px rgba(255, 46, 147, 0.5), 0 0 30px rgba(255, 46, 147, 0.2)'
          }
        }
      }
    }
  </script>
  <style>
    /* 3D 卡牌翻轉必備 CSS */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-cyber-dark text-slate-100 min-h-screen font-sans antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-cyber-dark to-black selection:bg-cyber-blue selection:text-black">

  <!-- 頂部導覽列 -->
  <header class="border-b border-slate-800 bg-cyber-dark/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-cyber-red animate-ping"></div>
        <h1 class="text-xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyber-blue via-white to-cyber-red">
          TELEPATHY <span class="text-xs px-2 py-0.5 rounded border border-cyber-blue/40 text-cyber-blue font-normal">v2.0</span>
        </h1>
      </div>
      
      <!-- 玩家/房間資訊與隱藏房主開關 -->
      <div class="flex items-center space-x-4">
        <div id="roomBadge" class="hidden text-xs bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-slate-300">
          房號：<span id="displayRoomId" class="font-bold text-cyber-blue">---</span>
        </div>
        <div id="userBadge" class="hidden text-xs bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-slate-300">
          玩家：<span id="displayPlayerName" class="font-bold text-cyber-red">---</span>
        </div>
        
        <!-- 隱藏房主控制台按鈕 -->
        <button id="toggleHostPanelBtn" onclick="toggleHostModal()" class="text-xs bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-400 hover:text-white px-2 py-1 rounded transition flex items-center gap-1" title="隱藏房主控制台">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          <span class="hidden sm:inline">房主控制</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- 階段 1：登入與進入房間 -->
    <section id="loginSection" class="max-w-md mx-auto my-12 bg-cyber-card p-8 rounded-2xl border border-slate-800 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-10 -left-10 w-32 h-32 bg-cyber-blue/10 rounded-full blur-2xl"></div>
      <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-cyber-red/10 rounded-full blur-2xl"></div>
      
      <h2 class="text-2xl font-bold text-center mb-6 tracking-wide text-white">連接雲端大腦</h2>
      
      <form onsubmit="handleJoinRoom(event)" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">房間代碼 (Room ID)</label>
          <input type="text" id="inputRoomId" required placeholder="例如：101 或 VIP88" class="w-full bg-slate-900 border border-slate-700 focus:border-cyber-blue focus:ring-1 focus:ring-cyber-blue rounded-xl px-4 py-3 text-white outline-none transition uppercase tracking-widest font-mono">
        </div>
        
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">玩家暱稱 (Player Name)</label>
          <input type="text" id="inputPlayerName" required placeholder="請輸入您的暱稱" class="w-full bg-slate-900 border border-slate-700 focus:border-cyber-red focus:ring-1 focus:ring-cyber-red rounded-xl px-4 py-3 text-white outline-none transition">
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-cyber-blue to-blue-600 hover:from-cyber-blue/90 hover:to-blue-500 text-black font-bold py-3.5 rounded-xl transition shadow-neon-blue transform active:scale-95">
          同步連線進入
        </button>
      </form>
    </section>

    <!-- 階段 2：主要遊戲大廳 (動態更新) -->
    <section id="gameSection" class="hidden space-y-8">
      <!-- 狀態提示與題目看板 -->
      <div class="bg-cyber-card border border-slate-800 rounded-2xl p-6 md:p-8 text-center relative overflow-hidden shadow-xl">
        <div id="statusBadge" class="inline-block px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest bg-amber-500/10 border border-amber-500/30 text-amber-400 mb-4">
          等待房主出題中...
        </div>
        
        <h2 id="questionDisplay" class="text-2xl md:text-4xl font-extrabold text-white tracking-wide my-2 min-h-[3rem] flex items-center justify-center">
          「等待同步題目中...」
        </h2>

        <!-- 填答區 (僅在 playing 狀態顯示) -->
        <div id="answerFormArea" class="mt-6 max-w-lg mx-auto hidden">
          <form onsubmit="handleSubmitAnswer(event)" class="flex gap-2">
            <input type="text" id="inputAnswer" required placeholder="輸入你的直覺答案..." class="flex-1 bg-slate-900 border border-slate-700 focus:border-cyber-blue rounded-xl px-4 py-3 text-white outline-none">
            <button type="submit" class="bg-cyber-blue hover:bg-cyan-400 text-black font-bold px-6 py-3 rounded-xl transition shadow-neon-blue whitespace-nowrap">
              送出答案
            </button>
          </form>
          <p id="submittedTip" class="text-xs text-cyber-blue mt-2 hidden">✓ 答案已成功傳送至雲端，等待房主開牌！</p>
        </div>
      </div>

      <!-- 3D 卡牌翻牌展示區 -->
      <div>
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-slate-300 flex items-center gap-2">
            <span>玩家默契矩陣</span>
            <span id="playerCountBadge" class="text-xs bg-slate-800 border border-slate-700 text-slate-400 px-2.5 py-0.5 rounded-full">0 人</span>
          </h3>
          <div class="text-xs text-slate-500">自動每 2 秒輪詢同步</div>
        </div>

        <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6">
          <!-- 3D 卡牌動態生成於此 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 隱藏房主控制台 Modal -->
  <div id="hostModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-cyber-card border border-cyber-red/40 rounded-2xl p-6 max-w-lg w-full shadow-neon-red space-y-6 relative">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-cyber-red"></span>
          <h3 class="text-lg font-bold text-white tracking-wide">隱藏房主控制台</h3>
        </div>
        <button onclick="toggleHostModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>

      <!-- 出題表單 -->
      <form onsubmit="handleSetQuestion(event)" class="space-y-3">
        <label class="block text-xs font-bold uppercase text-slate-400">發布新題目</label>
        <div class="flex gap-2">
          <input type="text" id="inputNewQuestion" required placeholder="例如：提到紅色會想到什麼？" class="flex-1 bg-slate-900 border border-slate-700 focus:border-cyber-red rounded-xl px-4 py-2.5 text-white text-sm outline-none">
          <button type="submit" class="bg-cyber-red hover:bg-pink-600 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition">
            出題並重置答案
          </button>
        </div>
      </form>

      <!-- 動作按鈕組 -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="handleReveal()" class="w-full bg-gradient-to-r from-cyber-blue to-blue-600 hover:opacity-90 text-black font-bold py-3 rounded-xl text-sm shadow-neon-blue transition">
          🃏 全網頁同步開牌
        </button>
        <button onclick="handleReset()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-sm border border-slate-700 transition">
          🔄 清空房間重置
        </button>
      </div>

      <div class="text-[11px] text-slate-500 text-center">
        提示：作為房主，您可以點擊開牌觸發全網頁 3D 翻牌動畫。
      </div>
    </div>
  </div>

  <script>
    const SHEET_NAME = 'TelepathyData';
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwppSwg05mVBAVKlffK0fxxOa_nzviEJLvG0Nkc8Ezt-fmzzLFLdvauRug7Fn71fD7F/exec";

    let currentRoom = "";
    let currentPlayer = "";
    let gameState = { status: "setup", question: "", answers: {} };
    let pollingTimer = null;

    function handleJoinRoom(e) {
      e.preventDefault();
      const roomInput = document.getElementById('inputRoomId').value.trim();
      const playerInput = document.getElementById('inputPlayerName').value.trim();

      if (!roomInput || !playerInput) return;

      currentRoom = roomInput;
      currentPlayer = playerInput;

      document.getElementById('displayRoomId').innerText = currentRoom;
      document.getElementById('displayPlayerName').innerText = currentPlayer;
      document.getElementById('roomBadge').classList.remove('hidden');
      document.getElementById('userBadge').classList.remove('hidden');

      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('gameSection').classList.remove('hidden');

      fetchGameState();
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = setInterval(fetchGameState, 2000);
    }

    async function fetchGameState() {
      if (!currentRoom) return;
      try {
        const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}`);
        const data = await response.json();
        gameState = data;
        renderUI();
      } catch (err) {
        console.error("Fetch game state error:", err);
      }
    }

    async function postAction(payload) {
      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ room: currentRoom, ...payload })
        });
        fetchGameState();
      } catch (err) {
        console.error("Post action error:", err);
      }
    }

    function renderUI() {
      const { status, question, answers } = gameState;
      const statusBadge = document.getElementById('statusBadge');
      const questionDisplay = document.getElementById('questionDisplay');
      const answerFormArea = document.getElementById('answerFormArea');
      const submittedTip = document.getElementById('submittedTip');

      if (status === 'setup') {
        statusBadge.innerText = '等待房主出題中';
        statusBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest bg-amber-500/10 border border-amber-500/30 text-amber-400 mb-4';
        questionDisplay.innerText = '「 等待房主出題... 」';
        answerFormArea.classList.add('hidden');
      } else if (status === 'playing') {
        statusBadge.innerText = '作答中 (對決進行中)';
        statusBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest bg-cyber-blue/10 border border-cyber-blue/30 text-cyber-blue mb-4 animate-pulse';
        questionDisplay.innerText = `「 ${question} 」`;
        answerFormArea.classList.remove('hidden');

        if (answers && answers[currentPlayer]) {
          submittedTip.classList.remove('hidden');
        } else {
          submittedTip.classList.add('hidden');
        }
      } else if (status === 'revealed') {
        statusBadge.innerText = '已開牌 (默契揭曉)';
        statusBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest bg-cyber-red/10 border border-cyber-red/30 text-cyber-red mb-4';
        questionDisplay.innerText = `「 ${question} 」`;
        answerFormArea.classList.add('hidden');
      }

      renderCards(answers, status === 'revealed');
    }

    function renderCards(answers = {}, isRevealed = false) {
      const cardsGrid = document.getElementById('cardsGrid');
      const players = Object.keys(answers);
      document.getElementById('playerCountBadge').innerText = `${players.length} 人已參與`;

      if (players.length === 0) {
        cardsGrid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500 border border-dashed border-slate-800 rounded-2xl">
            暫無玩家填答數據，請等待玩家送出答案...
          </div>
        `;
        return;
      }

      cardsGrid.innerHTML = players.map(player => {
        const answerText = answers[player] || "未作答";
        const isSelf = player === currentPlayer;

        return `
          <div class="w-full h-44 perspective-1000">
            <div class="relative w-full h-full duration-700 transform-style-3d transition-transform ${isRevealed ? 'rotate-y-180' : ''}">
              
              <!-- 牌面背面 (未開牌) -->
              <div class="absolute inset-0 w-full h-full rounded-2xl border ${isSelf ? 'border-cyber-blue shadow-neon-blue' : 'border-slate-800'} bg-cyber-card p-4 flex flex-col justify-between items-center backface-hidden">
                <div class="w-full flex justify-between items-center">
                  <span class="text-xs font-bold ${isSelf ? 'text-cyber-blue' : 'text-slate-400'}">${player} ${isSelf ? '(你)' : ''}</span>
                  <span class="w-2 h-2 rounded-full bg-cyber-blue animate-ping"></span>
                </div>
                <div class="text-center">
                  <div class="w-12 h-12 mx-auto rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-cyber-blue font-mono font-bold text-lg mb-1">
                    ?
                  </div>
                  <p class="text-xs text-slate-400">答案已鎖定</p>
                </div>
                <div class="text-[10px] text-slate-600 uppercase tracking-widest">TELEPATHY</div>
              </div>

              <!-- 牌面正面 (開牌揭曉) -->
              <div class="absolute inset-0 w-full h-full rounded-2xl border ${isSelf ? 'border-cyber-red shadow-neon-red' : 'border-slate-700'} bg-gradient-to-br from-cyber-card via-slate-900 to-cyber-redDark p-4 flex flex-col justify-between items-center backface-hidden rotate-y-180">
                <div class="w-full text-left">
                  <span class="text-xs font-bold text-slate-300">${player}</span>
                </div>
                <div class="text-center px-2">
                  <p class="text-xs text-cyber-red font-semibold mb-1">直覺答案</p>
                  <p class="text-lg md:text-xl font-black text-white break-all leading-tight">${escapeHtml(answerText)}</p>
                </div>
                <div class="w-full text-right">
                  <span class="text-[9px] bg-cyber-red/20 text-cyber-red px-2 py-0.5 rounded border border-cyber-red/30">REVEALED</span>
                </div>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    function handleSubmitAnswer(e) {
      e.preventDefault();
      const ansInput = document.getElementById('inputAnswer');
      const val = ansInput.value.trim();
      if (!val) return;

      postAction({
        action: 'submit_answer',
        playerName: currentPlayer,
        answer: val
      });
      ansInput.value = '';
    }

    function handleSetQuestion(e) {
      e.preventDefault();
      const qInput = document.getElementById('inputNewQuestion');
      const val = qInput.value.trim();
      if (!val) return;

      postAction({
        action: 'set_question',
        question: val
      });
      qInput.value = '';
      toggleHostModal();
    }

    function handleReveal() {
      postAction({ action: 'reveal' });
      toggleHostModal();
    }

    function handleReset() {
      if (confirm('確定要清空並重置房間狀態嗎？')) {
        postAction({ action: 'reset' });
        toggleHostModal();
      }
    }

    function toggleHostModal() {
      const modal = document.getElementById('hostModal');
      modal.classList.toggle('hidden');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
